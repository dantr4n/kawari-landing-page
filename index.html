<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kawari — Học tiếng Nhật với AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@500;800&display=swap" rel="stylesheet">
<style>
/* VOICE: chirpy edtech landing page that curdles into dread, then goes quiet and honest
   IDEA: an app-store landing page whose product slowly takes the reader's place (代替 read as かわり)
   PICTURE: phone chat + friendly mascot; later a sealed lower face that cannot open its mouth
   COLOUR and TYPE: clear sky #eef7fd / #2f9be0 sinking through lavender into violet-black #0e0a1c; Be Vietnam Pro, Noto Serif JP, Noto Serif
   LAYOUT: one mobile column, full-width bands, wider grids from 760px */
:root{--bg:#eef7fd;--ink:#12233a;--mute:#56697b;--acc:#2f9be0;--card:#fff;--line:#d5e8f4;--d:0;--fx:0;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px;-webkit-text-size-adjust:100%;overflow-anchor:none}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Be Vietnam Pro","Noto Sans JP",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
a{color:inherit}
ruby{ruby-position:over}
rt{font:500 .5em/1 "Noto Sans JP",sans-serif;opacity:.72;letter-spacing:0}
.wrap{max-width:1080px;margin:0 auto}
.band{padding:clamp(48px,8vw,96px) max(5vw,18px);position:relative}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.08}
h2{font-size:clamp(28px,7vw,40px);font-weight:800;letter-spacing:-.02em;margin-bottom:24px}
p{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;background:var(--acc);color:#fff;font:700 16px "Be Vietnam Pro",sans-serif;text-decoration:none;border:0;cursor:pointer;box-shadow:0 8px 20px -8px var(--acc)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #7b5cff;outline-offset:3px}

/* nav */
.nav{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:10px max(4vw,14px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transition:transform .5s}
.nav.gone{transform:translateY(-110%)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;text-decoration:none;color:var(--ink);letter-spacing:-.01em;width:7.2em}
.logo i{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--acc);color:#fff;font:800 18px "Noto Sans JP",sans-serif;flex:none}
.lang{margin-left:auto;min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 14px "Be Vietnam Pro";cursor:pointer}
.nav .btn{min-height:44px;width:142px;padding:0 10px;font-size:14px;white-space:nowrap;box-shadow:none}

/* hero */
.hero{padding-top:28px}
.hero-grid{display:grid;gap:44px;align-items:center}
.pill{display:inline-grid;padding:7px 14px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:500;color:var(--mute);margin-bottom:18px}
.pill>span{grid-area:1/1;transition:opacity .5s}
.pill>span+span,.pill.alt>span:first-child{opacity:0}
.pill.alt>span+span{opacity:1}
.hero h1{font-size:clamp(36px,10vw,56px);font-weight:800;letter-spacing:-.03em}
.lead{font-size:17px;color:var(--mute);margin:18px 0 26px;max-width:34em}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.trust{display:flex;flex-wrap:wrap;gap:8px 20px;list-style:none;padding:0;margin:26px 0 0;font-size:14px;color:var(--mute)}
.trust b{color:var(--ink)}
.phone-wrap{position:relative;justify-self:center;padding-top:62px}
.phone{width:min(320px,84vw);border-radius:38px;border:10px solid #12233a;background:#fff;box-shadow:0 30px 60px -20px rgba(18,35,58,.35);overflow:hidden;color:#12233a}
.ph-top{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid #e3eef6;font-size:15px}
.ph-top .dot{width:9px;height:9px;border-radius:50%;background:#34c38f}
.ph-top small{color:#7d8ea0;margin-left:auto;font-size:13px}
.chat{padding:14px 12px;display:flex;flex-direction:column;gap:8px;min-height:330px;background:#f7fbfe}
.b{max-width:84%;padding:9px 13px;border-radius:18px;font-size:14.5px;line-height:1.75;animation:pop .5s both}
.b.u{align-self:flex-end;background:#12233a;color:#fff;border-bottom-right-radius:6px}
.b.k{align-self:flex-start;background:#dff0fb;color:#0e3452;border-bottom-left-radius:6px}
.b:nth-child(2){animation-delay:.5s}.b:nth-child(3){animation-delay:1s}.b:nth-child(4){animation-delay:1.5s}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.ph-input{display:flex;align-items:center;margin:10px;padding:10px 10px 10px 16px;border-radius:999px;background:#edf4f9;color:#7d8ea0;font-size:14px}
.ph-input b{margin-left:auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#fff}

/* mascot */
.mascot{width:112px}
.mascot svg{display:block;width:100%;overflow:visible}
.m-hero{position:absolute;top:0;right:-6px;z-index:2}
.m-sh{fill:rgba(18,35,58,.14)}.m-ch{fill:#ff9db5}
.cart .m-sc{fill:#fff}.cart .m-pu{fill:#12233a}.cart .m-gl{fill:#fff}
.cart .m-e{transform-box:fill-box;transform-origin:center;transition:transform .09s}
.blink .cart .m-e{transform:scaleY(.08)}
.m-mouth{fill:#12233a}

/* warp: glyphs sit over the original letters, so nothing reflows */
.w{white-space:nowrap}
.c.x{color:transparent;position:relative}
.c.x::after{content:attr(data-g);position:absolute;left:50%;top:0;transform:translateX(-50%) scaleX(.62);color:var(--acc);font-family:"Noto Sans JP",sans-serif;font-weight:500}

/* features */
.grid3{display:grid;gap:16px}
.card{background:var(--card);border-radius:24px;padding:24px;box-shadow:0 0 0 1px var(--line),0 10px 30px -18px rgba(18,20,58,.25)}
.card h3{font-size:20px;margin:14px 0 8px}
.card p{color:var(--mute)}
.ico{width:48px;height:48px;border-radius:14px;background:color-mix(in srgb,var(--acc) 14%,var(--card));display:grid;place-items:center;color:var(--acc)}
.ico svg{width:26px;height:26px}
.fine{margin-top:12px;font-size:13px;color:color-mix(in srgb,var(--mute) 45%,var(--card))}

/* steps */
.steps{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.steps li{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start}
.steps .n{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:800 20px "Be Vietnam Pro"}
.steps h3{font-size:20px;margin:4px 0 4px}.steps p{color:var(--mute)}

/* stats */
.stat{background:var(--card);border-radius:24px;padding:24px;box-shadow:0 0 0 1px var(--line)}
.stat .big{font:800 clamp(40px,12vw,56px)/1 "Be Vietnam Pro";letter-spacing:-.03em;color:var(--acc);font-variant-numeric:tabular-nums}
.stat p{margin-top:10px;color:var(--mute)}
.notes{margin-top:22px;display:grid;gap:8px;font-size:13px;color:color-mix(in srgb,var(--mute) 78%,var(--bg))}
.notes a{text-decoration:underline}

/* reviews */
.rev{display:grid;gap:14px}
.r{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 0 0 1px var(--line)}
.r header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.r b{display:block}.r small{color:var(--mute);font-size:13px}
.stars{color:#f2a93b;letter-spacing:2px}
.r.you .av{background:#0e0a1c}

/* pricing */
.plans{display:grid;gap:16px}
.plan{background:var(--card);border-radius:26px;padding:26px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:12px;position:relative}
.plan h3{font-size:20px}
.plan .motto{font-size:14px;color:color-mix(in srgb,var(--bg) 62%,var(--ink));margin-top:-4px}
.price{font:800 36px/1 "Be Vietnam Pro";letter-spacing:-.02em}
.price small{font-size:15px;font-weight:500;color:var(--mute)}
.plan ul{list-style:none;padding:0;margin:0;display:grid;gap:8px;color:var(--mute)}
.plan li{padding-left:24px;position:relative}
.plan li::before{content:"";position:absolute;left:2px;top:.6em;width:10px;height:6px;border-left:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:rotate(-45deg)}
.plan .btn{margin-top:auto}
.plan.forever{background:var(--ink);color:var(--bg);box-shadow:none}
.plan.forever ul,.plan.forever .price small{color:color-mix(in srgb,var(--bg) 70%,var(--ink))}
.plan.forever li::before{border-color:#a98bff}
.plan.forever .price{font-size:18px;line-height:1.35;font-weight:700}
.tag{position:absolute;top:-12px;right:20px;background:var(--acc);color:#fff;font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px}

/* faq */
.faq{display:grid;gap:10px;max-width:760px}
details{background:var(--card);border-radius:18px;box-shadow:0 0 0 1px var(--line)}
summary{list-style:none;cursor:pointer;min-height:56px;padding:16px 52px 16px 20px;font-weight:700;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:24px;color:var(--acc)}
details[open] summary::after{content:"–"}
details p{padding:0 20px 18px;color:var(--mute)}

/* chat log */
.log{background:linear-gradient(#0000,#0e0a1c 240px);color:#e6e1f2;padding-top:180px;padding-bottom:40vh}
.log h2{color:#f1ecff}.log .sub{color:#9a91b5;margin:-12px 0 28px}
.loglist{position:relative;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.loglist>.b,.loglist>.day,.loglist>.typing{opacity:0;transform:translateY(10px);transition:opacity .9s,transform .9s}
.loglist>.on{opacity:1;transform:none}
.loglist .day{align-self:center;font-size:13px;color:#7d7596;padding:16px 0 4px}
.loglist .b{animation:none}
.loglist .b.u{background:#231d38;color:#dcd6ee}
.loglist .b.k{background:#2c1b52;color:#e1d4ff}
.loglist .b.x{align-self:flex-end;background:#4b2a86;color:#f0e8ff;font:400 16px/1.9 "Noto Serif JP",serif}
.typing{align-self:flex-end;background:#231d38;border-radius:18px;padding:12px 16px;display:flex;gap:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:#867ca3;animation:ty 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes ty{50%{opacity:.2}}
.leye{position:absolute;pointer-events:none;opacity:0}
.leye svg{width:100%;display:block;transform-origin:50% 50%}
.leye .flid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);transition:transform .14s ease-in}
.leye.bl .flid{transform:scaleY(1)}

/* the mouth */
.void{height:460vh;background:#0b0716}
.stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.vl{position:absolute;left:7%;right:7%;text-align:center;font:400 clamp(21px,6vw,36px)/1.35 "Noto Serif","Noto Serif JP",serif;color:#ebe3ff;opacity:0;transform:translateY(14px);transition:opacity 1.4s,transform 1.8s;text-shadow:0 0 18px rgba(140,80,255,.55),0 0 2px #000;pointer-events:none;text-wrap:balance}
.vl.on{opacity:1;transform:none}
.vl.mir{transform:scaleX(-1) translateY(14px)}.vl.mir.on{transform:scaleX(-1)}
.vl.jp{writing-mode:vertical-rl;font-family:"Noto Serif JP",serif;left:auto;right:5%;top:6%;letter-spacing:.3em;font-size:clamp(20px,5vw,30px);line-height:1.6}
.vl.huge{font:900 min(34vw,24vh)/1 "Noto Serif JP",serif;color:#a98bff;top:3%;text-shadow:0 0 40px #6a2cff}
.vl.huge.on{animation:hum 1.4s ease-in-out infinite}
@keyframes hum{50%{opacity:.5;transform:scale(1.04)}}
.vl.small{font:400 14px/1.5 "Be Vietnam Pro",sans-serif;letter-spacing:.04em;color:#a69cc4}
.hold{position:absolute;border:0;background:transparent;border-radius:50%;cursor:pointer;touch-action:pan-y;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;pointer-events:none;color:transparent;font-size:1px}
.hold:focus-visible{outline:2px solid rgba(169,139,255,.6)}
.flash{position:absolute;inset:0;background:#f4efff;opacity:0;pointer-events:none}
.shake #cv{animation:sh .1s infinite}
@keyframes sh{25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}

/* evidence, hidden until the lips are pried open */
.locked #ev,.locked #end{display:none}
.ev{background:#0e0a1c;color:#e6e1f2}
.ev h2{font:700 clamp(30px,8vw,46px)/1.1 "Noto Serif",serif;color:#fff;letter-spacing:-.01em}
.ev .sub{color:#b3abc8;max-width:40em;font-size:17px;margin:-6px 0 34px}
.studies{display:grid;gap:14px}
.st{border:1px solid #2a2245;border-radius:18px;padding:22px;background:#141027}
.st .ven{font-size:13px;color:#8e86a8;margin-bottom:8px}
.st h3{font:700 19px/1.3 "Noto Serif",serif;margin-bottom:12px}
.st h3 a{color:#cbb8ff;text-decoration-thickness:1px;text-underline-offset:3px}
.st .big{font:700 clamp(30px,9vw,42px)/1.05 "Noto Serif",serif;color:#b18cff;margin-bottom:12px;font-variant-numeric:tabular-nums}
.st .big small{display:block;font:400 14px/1.4 "Be Vietnam Pro";color:#9a91b5;margin-top:4px}
.st p{margin-top:8px}
.st .lim{color:#a59dbb;font-size:15px}
.st b{color:#fff}
.st.hope{border-color:#1d5a6e;background:#0b1622}
.st.hope h3 a,.st.hope .big{color:#8fd6ff}
.ev .note{margin-top:26px;color:#b3abc8;max-width:44em}

/* end */
.end{background:linear-gradient(#0e0a1c,#eef4fc 300px);color:#141a2e;padding-top:320px}
.end h2{font:700 clamp(34px,10vw,60px)/1.05 "Noto Serif",serif;letter-spacing:-.02em;max-width:14em}
.end .say{font:400 clamp(18px,4.6vw,22px)/1.5 "Noto Serif",serif;max-width:32em;margin-top:18px}
.end h3{font:700 20px "Noto Serif",serif;margin:44px 0 16px}
.habits{list-style:none;padding:0;margin:0;display:grid;gap:12px;counter-reset:h}
.habits li{counter-increment:h;background:#fff;border-radius:18px;padding:18px 18px 18px 64px;position:relative;box-shadow:0 0 0 1px #d9e2f0}
.habits li::before{content:counter(h);position:absolute;left:18px;top:16px;width:32px;height:32px;border-radius:50%;background:#141a2e;color:#eef4fc;display:grid;place-items:center;font-weight:800}
.habits b{display:block;font-size:17px}.habits span{color:#545c75;line-height:1.75}
.try{margin-top:40px;background:#141a2e;color:#eef4fc;border-radius:24px;padding:24px}
.try label{display:block;font:700 19px/1.4 "Noto Serif","Noto Serif JP",serif;margin-bottom:8px}
.try .hint{color:#aab3cc;font-size:15px;margin-bottom:14px}
.try form{display:flex;gap:10px;flex-wrap:wrap}
.try input{flex:1 1 180px;min-height:48px;border-radius:14px;border:0;padding:0 16px;font:16px "Noto Sans JP","Be Vietnam Pro",sans-serif;background:#262d48;color:#fff}
.try .btn{background:#5bbcf0;color:#06233a;box-shadow:none}
.try output{display:block;margin-top:14px;min-height:1.5em;color:#cfd6ea;line-height:1.8}
.prov{margin-top:56px;font:700 clamp(22px,6.4vw,32px)/1.8 "Noto Serif JP",serif}
.prov small{display:block;font:400 16px/1.5 "Noto Serif",serif;color:#545c75}
.foot{margin-top:40px;padding-top:20px;border-top:1px solid #d5dbee;font-size:14px;color:#545c75}

/* overlays */
.vig{position:fixed;inset:0;pointer-events:none;z-index:35;box-shadow:inset 0 0 calc(var(--fx)*180px) calc(var(--fx)*30px) rgba(14,4,34,calc(var(--fx)*.7))}
#px{position:fixed;inset:0;pointer-events:none;z-index:41;opacity:0;background-size:512px 512px;image-rendering:pixelated;image-rendering:crisp-edges}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,calc(100% + 40px));visibility:hidden;z-index:50;background:#12233a;color:#fff;padding:14px 18px;border-radius:16px;width:min(420px,calc(100vw - 32px));font-size:15px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:transform .45s,visibility 0s .45s}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .45s}

@media(min-width:760px){
  .grid3,.plans,.rev{grid-template-columns:repeat(3,minmax(0,1fr))}
  .studies{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:repeat(3,minmax(0,1fr))}
  .steps li{grid-template-columns:1fr}
  .habits{grid-template-columns:repeat(2,minmax(0,1fr))}
  .end .inner,.ev .inner{max-width:900px;margin:0 auto}
}
@media(min-width:900px){.hero-grid{grid-template-columns:1.1fr .9fr}.hero{padding-top:56px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="locked">

<nav class="nav" id="nav">
  <a class="logo" href="#top"><i>代</i><span id="logoTxt">Kawari</span></a>
  <button class="lang" id="langBtn" type="button" aria-label="Language">EN</button>
  <a class="btn" href="#plans" id="navCta"></a>
</nav>

<header class="band hero" id="top" data-dread="0">
  <div class="wrap hero-grid">
    <div>
      <span class="pill" id="badge"><span data-i="badge"></span><span data-i="badge2" aria-hidden="true"></span></span>
      <h1 data-i="h1"></h1>
      <p class="lead" data-i="lead"></p>
      <div class="cta"><a class="btn" href="#plans" data-i="cta1"></a><a class="btn ghost" href="#how" data-i="cta2"></a></div>
      <ul class="trust"><li><b>4,8★</b> <span data-i="t1"></span></li><li><b>2M+</b> <span data-i="t2"></span></li><li><b>N5–N1</b> <span data-i="t3"></span></li></ul>
    </div>
    <div class="phone-wrap">
      <div class="mascot m-hero"></div>
      <div class="phone">
        <div class="ph-top"><span class="dot"></span><b>Kawari</b><small data-i="online"></small></div>
        <div class="chat" id="heroChat"></div>
        <div class="ph-input"><span data-i="ask"></span><b>↑</b></div>
      </div>
    </div>
  </div>
</header>

<section class="band" id="features" data-dread=".06">
  <div class="wrap">
    <h2 data-i="fh"></h2>
    <div class="grid3">
      <article class="card"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></div><h3 data-i="f1t"></h3><p data-i="f1d"></p></article>
      <article class="card"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l5 5L9 20H4v-5z"/><path d="M13 6l5 5"/></svg></div><h3 data-i="f2t"></h3><p data-i="f2d"></p></article>
      <article class="card"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4a4 4 0 0 0-4 4 4 4 0 0 0-1 7 4 4 0 0 0 5 5h1V4z"/><path d="M15 4a4 4 0 0 1 4 4 4 4 0 0 1 1 7 4 4 0 0 1-5 5h-1V4z"/></svg></div><h3 data-i="f3t"></h3><p data-i="f3d" data-w=".18"></p><p class="fine" data-i="f3n"></p></article>
    </div>
  </div>
</section>

<section class="band" id="how" data-dread=".12">
  <div class="wrap">
    <h2 data-i="hh"></h2>
    <ol class="steps">
      <li><span class="n">1</span><div><h3 data-i="s1t"></h3><p data-i="s1d"></p></div></li>
      <li><span class="n">2</span><div><h3 data-i="s2t"></h3><p data-i="s2d"></p></div></li>
      <li><span class="n">3</span><div><h3 data-i="s3t"></h3><p data-i="s3d" data-w=".22"></p></div></li>
    </ol>

const STUDIES=[
{id:"kosmyna",ven:"Kosmyna et al. · MIT Media Lab · arXiv 2025",t:"Your Brain on ChatGPT: Accumulation of Cognitive Debt when Using an AI Assistant for Essay Writing Task",u:"https://arxiv.org/abs/2506.08872",
 big:{vi:"Yếu nhất",en:"Weakest"},bl:{vi:"kết nối não ở nhóm dùng ChatGPT, đo bằng EEG",en:"brain connectivity in the ChatGPT group, measured by EEG"},
 f:{vi:"54 người viết bài luận theo ba nhóm: tự viết, dùng công cụ tìm kiếm, dùng ChatGPT. Nhóm tự viết có mạng kết nối não mạnh và lan rộng nhất; nhóm tìm kiếm ở giữa; nhóm ChatGPT yếu nhất. Người dùng ChatGPT khó trích dẫn lại chính bài mình vừa viết. Ngược lại, người tự viết trước rồi mới dùng ChatGPT cho thấy mức kết nối cao hơn.",en:"54 people wrote essays in three groups: brain only, search engine, ChatGPT. The brain-only group showed the strongest, most distributed networks; search sat in the middle; the ChatGPT group was weakest. ChatGPT users struggled to quote their own essays. Conversely, people who wrote on their own first and used ChatGPT afterwards showed higher connectivity."},
 l:{vi:"Bản thảo chưa qua bình duyệt, mẫu nhỏ (chỉ 18 người ở buổi thứ tư). Kết nối não khác nhau không có nghĩa là “não bị hỏng”, và cũng không phải thước đo trực tiếp của việc học.",en:"Not yet peer-reviewed, small sample (only 18 people in session four). Different connectivity doesn't mean “brain damage”, and it isn't a direct measure of learning."}},
{id:"bastani",ven:"Bastani et al. · PNAS · 2025",t:"Generative AI without guardrails can harm learning: Evidence from high school mathematics",u:"https://doi.org/10.1073/pnas.2422633122",
 big:{vi:"+48% → −17%",en:"+48% → −17%"},bl:{vi:"luyện tập khi có AI → thi khi không có AI",en:"practice with AI → exam without it"},
 f:{vi:"Gần 1.000 học sinh trung học ở Thổ Nhĩ Kỳ. Nhóm dùng giao diện kiểu ChatGPT làm bài luyện tập tốt hơn 48%, nhưng khi bỏ AI đi thì thi kém hơn 17% so với nhóm không dùng. Học sinh dùng AI còn đánh giá quá cao những gì mình đã học. Một phiên bản “gia sư” có rào chắn — gợi ý thay vì đưa đáp án — xoá được phần lớn tác hại.",en:"Nearly 1,000 high school students in Turkey. The group with a ChatGPT-style interface did 48% better on practice problems, but once the AI was removed they scored 17% lower on the exam than students who never had it. AI users also overestimated how much they'd learned. A “tutor” version with guardrails — hints instead of answers — largely removed the harm."},
 l:{vi:"Một môn (toán), một bối cảnh, ngắn hạn. Và điều quan trọng: cùng một AI, thiết kế khác đi thì kết quả khác đi.",en:"One subject (maths), one setting, short term. And the important part: the same AI, designed differently, gave a different result."}},
{id:"shen",ven:"Shen & Tamkin · Anthropic · 2026",t:"How AI Impacts Skill Formation",u:"https://www.anthropic.com/research/AI-assistance-coding-skills",
 big:{vi:"−17%",en:"−17%"},bl:{vi:"điểm kiểm tra hiểu bài ở nhóm có trợ lý AI",en:"comprehension quiz score in the AI-assisted group"},
 f:{vi:"Thử nghiệm ngẫu nhiên với 52 lập trình viên (phần lớn còn junior) học một thư viện Python mới. Nhóm có AI làm bài kiểm tra ngay sau đó thấp hơn khoảng 17%, hụt nhiều nhất ở khả năng tìm lỗi; tốc độ thì chỉ nhanh hơn chút ít và không có ý nghĩa thống kê. Những người dùng AI để hỏi khái niệm và xin giải thích thì giữ lại kiến thức tốt hơn.",en:"A randomized trial with 52 (mostly junior) developers learning a new Python library. The AI group scored about 17% lower on the quiz right afterwards, with the biggest gap in debugging; they were only slightly faster, and not significantly. People who used the AI to ask conceptual questions and request explanations retained more."},
 l:{vi:"Mẫu nhỏ, một nhiệm vụ ngắn, lĩnh vực lập trình. Và vâng — đây là nghiên cứu của chính Anthropic, công ty làm ra AI đã viết trang này.",en:"Small sample, one short task, programming. And yes — this is Anthropic's own study, the company that makes the AI that wrote this page."}},
{id:"fan",ven:"Fan et al. · British Journal of Educational Technology · 2025",t:"Beware of Metacognitive Laziness: Effects of Generative Artificial Intelligence on Learning Motivation, Processes, and Performance",u:"https://arxiv.org/abs/2412.09315",
 f:{vi:"Thí nghiệm ngẫu nhiên với sinh viên viết bài: nhóm có ChatGPT cải thiện điểm bài luận, nhưng không thu được nhiều kiến thức hơn và không vận dụng tốt hơn. Họ cũng ít tự lập kế hoạch, tự đánh giá hơn so với nhóm có giáo viên hướng dẫn — tác giả gọi đó là “lười siêu nhận thức”.",en:"A randomized experiment with students on a writing task: the ChatGPT group improved their essay scores, but didn't gain significantly more knowledge or transfer it better. They also planned and self-evaluated less than the group guided by human experts — the authors call it “metacognitive laziness”."},
 l:{vi:"Một nhiệm vụ viết, thời gian ngắn, kiến thức đo ngay sau buổi học.",en:"One writing task, short duration, knowledge measured right after the session."}},
{id:"lee",ven:"Lee et al. · CHI 2025 · Microsoft Research & Carnegie Mellon",t:"The Impact of Generative AI on Critical Thinking: Self-Reported Reductions in Cognitive Effort and Confidence Effects From a Survey of Knowledge Workers",u:"https://doi.org/10.1145/3706598.3713778",
 big:{vi:"319",en:"319"},bl:{vi:"người làm việc trí óc, 936 ví dụ thực tế",en:"knowledge workers, 936 real examples"},
 f:{vi:"Càng tin vào AI, người ta càng ít tư duy phản biện. Càng tự tin vào năng lực của chính mình, người ta càng tư duy phản biện nhiều hơn.",en:"The more people trusted the AI, the less critical thinking they did. The more confident they were in their own ability, the more critical thinking they did."},
 l:{vi:"Số liệu tự báo cáo, khảo sát cắt ngang: cho thấy mối liên hệ, không chứng minh nhân quả.",en:"Self-reported, cross-sectional survey: shows an association, doesn't prove cause."}},
{id:"gerlich",ven:"Gerlich · Societies · 2025",t:"AI Tools in Society: Impacts on Cognitive Offloading and the Future of Critical Thinking",u:"https://doi.org/10.3390/soc15010006",
 big:{vi:"666",en:"666"},bl:{vi:"người tham gia (con số thật, không phải chúng tôi chọn)",en:"participants (real number, we didn't pick it)"},
 f:{vi:"Người dùng AI thường xuyên có điểm tư duy phản biện thấp hơn, phần lớn thông qua việc “giao” suy nghĩ cho công cụ. Người trẻ phụ thuộc vào AI nhiều hơn và có điểm thấp hơn.",en:"Frequent AI users scored lower on critical thinking, largely through offloading their thinking to the tool. Younger participants depended on AI more and scored lower."},
 l:{vi:"Nghiên cứu tương quan, không chứng minh nhân quả. Bài báo đã được đính chính vào tháng 9/2025.",en:"Correlational, doesn't prove cause. The paper received a correction in September 2025."}},
{id:"budzyn",ven:"Budzyń et al. · The Lancet Gastroenterology & Hepatology · 2025",t:"Endoscopist deskilling risk after exposure to artificial intelligence in colonoscopy",u:"https://doi.org/10.1016/S2468-1253(25)00133-5",
 big:{vi:"28,4% → 22,4%",en:"28.4% → 22.4%"},bl:{vi:"tỉ lệ phát hiện u tuyến khi không có AI",en:"adenoma detection rate without AI"},
 f:{vi:"19 bác sĩ nội soi giàu kinh nghiệm ở Ba Lan. Sau khi quen làm việc với AI phát hiện polyp, tỉ lệ phát hiện của họ ở những ca không có AI giảm rõ rệt. Đây là chuyên gia, không phải người mới học.",en:"19 experienced endoscopists in Poland. After getting used to an AI polyp detector, their detection rate in exams done without it dropped. These were experts, not beginners."},
 l:{vi:"Nghiên cứu quan sát, hồi cứu và đang bị tranh luận; một nghiên cứu tiến cứu ở Na Uy năm 2026 không thấy thay đổi đáng kể sau khi bỏ AI.",en:"Observational, retrospective, and contested; a 2026 prospective study in Norway found no significant change after the AI was removed."}},
{id:"dahmani",ven:"Dahmani & Bohbot · Scientific Reports · 2020",t:"Habitual use of GPS negatively impacts spatial memory during self-guided navigation",u:"https://doi.org/10.1038/s41598-020-62877-0",
 f:{vi:"50 tài xế: ai dùng GPS nhiều hơn trong đời thì trí nhớ không gian kém hơn khi phải tự tìm đường. 13 người được kiểm tra lại khoảng 3 năm sau: ai dùng GPS nhiều hơn trong thời gian đó thì suy giảm nhiều hơn.",en:"50 drivers: more lifetime GPS use went with worse spatial memory when navigating unaided. 13 were retested about three years later: more GPS use in between went with a steeper decline."},

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
const lerp=(a,b,t)=>a+(b-a)*t;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rb=s=>esc(s).replace(/\{([^|{}]+)\|([^{}]+)\}/g,"<ruby>$1<rt>$2</rt></ruby>");

/* warp: only the last card of a section, only after it has been read */
const GL="あいうえおかきくけこさしすせそたちつてとなにぬねのアイウエオカキクケコ代忘空無私汝眼口門闇呪亻氵忄辶冂囗ゐゑヰヱ";
const CJK=/[　-ヿ㐀-鿿＀-￯]/;
let WARP=[];
function prepWarp(el){
  const chars=[],nodes=[];
  const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("ruby")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  while(tw.nextNode())nodes.push(tw.currentNode);
  for(const n of nodes){const frag=document.createDocumentFragment();
    for(const part of n.data.split(/(\s+)/)){if(!part)continue;if(/^\s+$/.test(part)){frag.appendChild(document.createTextNode(part));continue}
      let w=null;
      for(const ch of Array.from(part)){const c=document.createElement("span");c.className="c";c.textContent=ch;chars.push(c);
        if(CJK.test(ch)){w=null;frag.appendChild(c)}else{if(!w){w=document.createElement("span");w.className="w";frag.appendChild(w)}w.appendChild(c)}}}
    n.replaceWith(frag)}
  el._w={order:chars.map(c=>[Math.random(),c]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]),n:0,p:0,seen:0,delay:Math.min(4500,1300+chars.length*45),max:+el.dataset.w};
}
function warpTick(dt){
  for(const el of WARP){const w=el._w,r=el.getBoundingClientRect();
    const full=r.height>0&&r.top>=60&&r.bottom<=innerHeight-6;
    if(full)w.seen+=dt*1000;
    if(full&&w.seen>w.delay)w.p=Math.min(1,w.p+dt/7);
    const target=Math.round(sm(0,1,w.p)*w.max*w.order.length);
    while(w.n<target){const c=w.order[w.n++];c.dataset.g=GL[Math.random()*GL.length|0];c.classList.add("x")}
    if(w.max>=.4&&w.n>0&&!reduce&&Math.random()<dt*5){w.order[Math.random()*w.n|0].dataset.g=GL[Math.random()*GL.length|0]}}
}
function warpReset(){for(const el of WARP){const w=el._w;for(let i=0;i<w.n;i++)w.order[i].classList.remove("x");w.n=0;w.p=0;w.seen=0}}

/* render */
let navKey="",titleKey="",logoKey="";
function render(){
  D=T[lang];root.lang=lang;
  $$("[data-i]").forEach(el=>{const v=D[el.dataset.i];if(typeof v==="string")el.innerHTML=rb(v)});
  $$("[data-ph]").forEach(el=>el.placeholder=D[el.dataset.ph]);
  $("#langBtn").textContent=lang==="vi"?"EN":"VI";
  $("#hold").setAttribute("aria-label",D.hold);$("#hold").textContent=D.hold;
  $("#heroChat").innerHTML=D.hero.map(([w,t])=>`<div class="b ${w}">${rb(t)}</div>`).join("");
  const L=D.log,n=L.length;
  $("#logList").innerHTML=L.map(([w,t],i)=>{const th=(i/n*.86).toFixed(3);if(w==="d")return`<div class="day" data-t="${th}">${esc(t)}</div>`;if(w==="t")return`<div class="typing" data-t="${th}"><i></i><i></i><i></i></div>`;return`<div class="b ${w}" data-t="${th}">${rb(t)}</div>`}).join("");
  $("#vlines").innerHTML=D.vlines.map(([t,txt,cls,top])=>`<div class="vl ${cls}" data-v="${t}" style="${top?`top:${top}%`:""}">${rb(txt)}</div>`).join("");
  $("#studies").innerHTML=STUDIES.map(s=>`<article class="st${s.hope?" hope":""}" id="ev-${s.id}"><p class="ven">${esc(s.ven)}</p><h3><a href="${s.u}" target="_blank" rel="noopener">${esc(s.t)}</a></h3>${s.big?`<p class="big">${esc(s.big[lang])}<small>${esc(s.bl[lang])}</small></p>`:""}<p><b>${esc(D.found)}</b> ${esc(s.f[lang])}</p><p class="lim"><b>${esc(D.lim)}</b> ${esc(s.l[lang])}</p></article>`).join("");
  $("#habits").innerHTML=D.habits.map(([b,s])=>`<li><b>${rb(b)}</b><span>${rb(s)}</span></li>`).join("");
  WARP=$$("[data-w]");WARP.forEach(prepWarp);
  navKey=titleKey=logoKey="";
  requestAnimationFrame(scatterEyes);
}
$("#langBtn").addEventListener("click",()=>{lang=lang==="vi"?"en":"vi";render();$("#tryOut").textContent=""});

  wasTop=atTop;
  if(maxD>=.95)residue=true;
  const eff=Math.max(d,residue?.3:0);

  let evFade=0,endFade=0;
  if(unlocked){const er=evEl.getBoundingClientRect(),nr=endEl.getBoundingClientRect();evFade=clamp((innerHeight-er.top)/(innerHeight*.6));endFade=clamp((innerHeight*.8-nr.top)/(innerHeight*.5))}
  root.style.setProperty("--d",d.toFixed(3));
  root.style.setProperty("--fx",(d*(1-evFade*.6)*(1-endFade)).toFixed(3));
  colours(d);

  nav.classList.toggle("gone",d>.66);
  const nk=eff<.26?"navcta":eff<.55?"navcta2":"navcta3";if(nk!==navKey){navKey=nk;navCta.textContent=D[nk]}
  badge.classList.toggle("alt",residue);
  const lk=eff>=.5?"代わり":"Kawari";if(lk!==logoKey){logoKey=lk;logoTxt.textContent=lk}
  const tk=d<.5?D.title0:d<.85?D.title1:"代わり";if(tk!==titleKey){titleKey=tk;document.title=tk}

  warpTick(dt);

  for(const o of MS){const r=o.svg.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)continue;const sc=r.width/120;
    [[o.p1,42],[o.p2,78]].forEach(([p,cx])=>{const ex=r.left+cx*sc,ey=r.top+60*sc,dx=ptr.x-ex,dy=ptr.y-ey,dist=Math.hypot(dx,dy)||1,k=Math.min(1,dist/160)*4.2;p.setAttribute("cx",(cx+dx/dist*k).toFixed(2));p.setAttribute("cy",(61+dy/dist*k).toFixed(2))});
    if(now>o.next){o.el.classList.add("blink");setTimeout(()=>o.el.classList.remove("blink"),140);o.next=now+2500+Math.random()*4000}}

  const lr=logEl.getBoundingClientRect();
  if(lr.bottom>-200&&lr.top<innerHeight+200){
    const lp=(innerHeight*.78-lr.top-160)/(lr.height-160-innerHeight*.4);
    for(const b of logList.children){if(b.dataset.t!==undefined)b.classList.toggle("on",lp>=+b.dataset.t)}
    for(const y of LE){const on=y.b.classList.contains("on");if(on&&!y.at)y.at=now+500+Math.random()*2800;if(!on)y.at=0;
      y.o+=((on&&now>y.at?1:0)-y.o)*Math.min(1,dt*2.5);
      if(y.o<.01){y.e.style.opacity="0";continue}
      y.e.style.opacity=(y.o*.6).toFixed(3);y.svg.style.transform=`scaleY(${(.12+.88*y.o).toFixed(3)})`;
      if(now>y.sac){y.sac=now+400+Math.random()*1700;if(Math.random()<.45){const r=y.e.getBoundingClientRect(),dx=ptr.x-(r.left+r.width/2),dy=ptr.y-(r.top+r.height/2),dd=Math.hypot(dx,dy)||1;y.tx=dx/dd*7;y.ty=dy/dd*2.5}else{y.tx=(Math.random()-.5)*14;y.ty=(Math.random()-.5)*5}}
      y.x+=(y.tx-y.x)*.35;y.y+=(y.ty-y.y)*.35;y.mv.setAttribute("transform",`translate(${y.x.toFixed(2)} ${y.y.toFixed(2)})`);
      if(now>y.bl){y.e.classList.add("bl");setTimeout(()=>y.e.classList.remove("bl"),160);y.bl=now+2500+Math.random()*7000}}}

  let v=0;
  if(vOn){const vr=V.getBoundingClientRect();v=clamp(-vr.top/(vr.height-innerHeight));drawVoid(now,dt,v)}
  vNow=v;

  const pxT=unlocked?0:(.75*sm(.03,1,d)+.25*sm(0,.5,v));
  pxOp+=(pxT-pxOp)*(unlocked?.03:.15);
  if(!reduce&&pxOp>.45&&now>pxFl){pxFl=now+140+Math.random()*160;pxX=Math.random()<.5?0:4}
  pxEl.style.opacity=(pxOp*.5).toFixed(3);
  const pos=`${pxX}px ${-Math.round(scrollY)}px`;if(pos!==pxPos){pxPos=pos;pxEl.style.backgroundPosition=pos}

  kanji+=dt*(1.4+d*28);kc.textContent=Math.floor(kanji).toLocaleString(lang==="vi"?"vi-VN":"en-US");
  if(!idleShown&&d>.25&&d<.66&&now-lastScroll>8000){idleShown=true;say(D.idle)}
  requestAnimationFrame(frame);
}

render();
if(document.fonts&&document.fonts.load)document.fonts.load('900 20px "Noto Serif JP"',"代").catch(()=>{});
requestAnimationFrame(frame);
}
</script>
